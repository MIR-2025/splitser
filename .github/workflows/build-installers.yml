name: build-installers

# Build native installers on each platform's own runner:
#   Linux  -> .deb, .rpm, .AppImage
#   Windows-> .exe (NSIS)
#   macOS  -> .dmg
# Run manually (Actions tab -> Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux deb rpm AppImage
            artifact: linux
          - os: windows-latest
            targets: --win nsis
            artifact: windows
          - os: macos-latest
            targets: --mac dmg
            artifact: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24          # current Active LTS (Node 20 went EOL Apr 2026)
      - name: Pin npm (avoid the broken npm@12 line)
        run: npm i -g npm@11
      - run: npm ci
      - name: Build installers
        run: npx electron-builder ${{ matrix.targets }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: splitser-${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg

  # On a v* tag: gather every platform's installers and publish one GitHub Release with them
  # attached, so the repo's Releases page is a real download page (not just a bare tag).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write            # let GITHUB_TOKEN create the release + upload assets
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release with the installers attached
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.exe
            dist/**/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false
