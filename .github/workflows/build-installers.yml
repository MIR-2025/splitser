name: build-installers

# Build native installers on each platform's own runner:
#   Linux  -> .deb, .rpm, .AppImage
#   Windows-> .exe (NSIS)
#   macOS  -> .dmg
# Run manually (Actions tab -> Run workflow) or by pushing a v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux deb rpm AppImage
            artifact: linux
          - os: windows-latest
            targets: --win nsis
            artifact: windows
          # Split the two Mac arches into separate jobs so each builds ONE dmg on its own runner --
          # building both in one job races two dmg volumes and flakes on `hdiutil detach ... busy`.
          - os: macos-latest
            targets: --mac dmg --arm64
            artifact: macos-arm64
          - os: macos-latest
            targets: --mac dmg --x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26          # newest LTS line (v26, Active LTS 2026-10-28); v25 is odd/EOL -- skip it
      - name: Pin npm (avoid the broken npm@12 line)
        run: npm i -g npm@11
      - run: npm ci
      # Retry ONLY genuinely transient failures. `hdiutil detach ... busy` is one: a dmg volume
      # can still be mounted when the next attempt starts. A code-signing failure is NOT -- it is
      # the same wrong credential every time, so retrying it just burns three runners and reports
      # the wrong cause. This step used to retry everything under an "hdiutil is flaky" label,
      # which hid a signing break from 0.1.37 onward behind a message about disk images.
      - name: Build installers
        shell: bash
        run: |
          # electron-builder takes the App Store Connect key as a FILE PATH, so the secret
          # (the .p8's contents) is written to the runner's temp dir, which the job discards.
          # The Apple ID pair is unset because getNotarizeOptions checks THAT branch first --
          # while APPLE_ID is set the API key is never read, which is how v0.1.43 and v0.1.44
          # both failed with a 401 against a dead app-specific password while a good key sat
          # unused. Mirrors mirsolo.com's desktop.yml, notarizing since its 0.1.2.
          notarize=
          extra=()
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
            (umask 077; printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY")
            unset APPLE_API_KEY_P8 APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            notarize="API key $APPLE_API_KEY_ID"
            echo "notarizing with: $notarize"
          else
            if [ "${{ startsWith(matrix.os, 'macos') }}" = true ]; then
              miss=
              [ -z "$APPLE_API_KEY_P8" ]  && miss="$miss SPLITSER_APPLE_API_KEY_P8"
              [ -z "$APPLE_API_KEY_ID" ]  && miss="$miss SPLITSER_APPLE_API_KEY_ID"
              [ -z "$APPLE_API_ISSUER" ]  && miss="$miss SPLITSER_APPLE_API_ISSUER"
              echo "::warning::not notarizing -- missing secret(s):$miss"
              echo "::warning::The dmg will be SIGNED but NOT notarized, so Gatekeeper still warns on first open."
            fi
            unset APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            # Be explicit rather than leaving electron-builder to discover it has no credentials:
            # without this it attempts notarization and fails late, which reads as a broken build
            # rather than an unset secret.
            extra+=(-c.mac.notarize=false)
          fi
          n=0
          log=$(mktemp)
          until npx electron-builder ${{ matrix.targets }} "${extra[@]}" --publish never 2>&1 | tee "$log"; do
            if grep -q 'HTTP status code: 401\|Invalid credentials' "$log"; then
              echo "::error::macOS notarization failed: Apple rejected the credential (HTTP 401)."
              echo "::error::Deterministic -- the same credential fails identically every time, so it is NOT retried."
              echo "::error::Check the key outside CI:  apple-key-check <AuthKey_*.p8> <KEY_ID> <ISSUER_ID>"
              echo "::error::Also confirm SPLITSER_APPLE_ID / SPLITSER_APPLE_APP_PASSWORD are DELETED: while"
              echo "::error::APPLE_ID is set, electron-builder picks that branch and never reads the API key."
              exit 1
            fi
            if grep -q 'set-key-partition-list\|No identity found\|Command failed: /usr/bin/security' "$log"; then
              echo "::error::macOS code signing failed -- this is a credential problem, not a flaky runner."
              echo "::error::'security set-key-partition-list' fails when the .p12 has no PRIVATE KEY in it"
              echo "::error::(exported from Keychain Access without the key), or CSC_KEY_PASSWORD is wrong."
              echo "::error::Check locally: openssl pkcs12 -in <cert>.p12 -nocerts -nodes -passin pass:'<pw>' | grep -c 'PRIVATE KEY'"
              echo "::error::0 = no key in the bundle. Re-export WITH the private key. Not retried: it is deterministic."
              exit 1
            fi
            n=$((n+1)); if [ "$n" -ge 3 ]; then echo "build failed after $n attempts"; exit 1; fi
            echo "::warning::build attempt $n failed (transient); freeing any stuck Splitser dmg volume, retrying"
            hdiutil detach -force /Volumes/Splitser* 2>/dev/null || true
            sleep 15
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing + notarization. Scoped to the mac jobs so a mac .p12 never
          # reaches the Windows job (CSC_LINK drives Windows signing too). Inert only while
          # SPLITSER_MAC is UNSET -- electron-builder skips signing when CSC_LINK is empty.
          # Once that secret exists it signs for real and a bad cert FAILS the build: mac went
          # green -> red at 0.1.37 for exactly that reason and stayed red, while the step label
          # blamed hdiutil. If you want unsigned mac builds back, delete the SPLITSER_MAC secret
          # rather than editing this block.
          CSC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.SPLITSER_MAC || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.SPLITSER_MAC_CSC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.os, 'macos') && secrets.SPLITSER_APPLE_TEAM_ID || '' }}
          # Notarization via an App Store Connect API key. The Apple ID route is deliberately
          # NOT wired: an app-specific password dies whenever the Apple ID password changes,
          # which is what silently broke 0.1.43. An API key survives that.
          APPLE_API_KEY_P8: ${{ startsWith(matrix.os, 'macos') && secrets.SPLITSER_APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(matrix.os, 'macos') && secrets.SPLITSER_APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(matrix.os, 'macos') && secrets.SPLITSER_APPLE_API_ISSUER || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: splitser-${{ matrix.artifact }}
          if-no-files-found: ignore
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg

  # On a v* tag: gather whatever DID build and publish one GitHub Release with it attached,
  # so the repo's Releases page is a real download page (not just a bare tag).
  #
  # `needs: build` on its own skips this job the moment ANY matrix leg fails, which is how
  # v0.1.37 ended up with green Linux and Windows installers and no release at all -- one
  # platform's signing problem held the other two hostage indefinitely. !cancelled() lets the
  # release run on a partial matrix. It is NOT always(): a cancelled run should stay cancelled,
  # and the check below still fails the job outright when nothing was produced, so a green
  # release is never an empty one. The body says which platforms are missing, because a release
  # that quietly ships three of five artifacts is the kind of unstated claim this project avoids.
  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write            # let GITHUB_TOKEN create the release + upload assets
    steps:
      - name: Download all built installers
        uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Note which platforms made it, and refuse to publish an empty release
        id: manifest
        shell: bash
        run: |
          have() { [ -n "$(find dist -type f -name "*$1" -print -quit 2>/dev/null)" ]; }
          if ! (have .deb || have .rpm || have .AppImage || have .exe || have .dmg); then
            echo "::error::no installers were produced by any platform -- nothing to release"
            exit 1
          fi
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
                            -o -name '*.exe' -o -name '*.dmg' \) -printf '  %f\n' | sort
          {
            echo 'body<<GHEOF'
            echo '### Installers in this release'
            echo
            for pair in 'deb:Linux .deb' 'rpm:Linux .rpm' 'AppImage:Linux .AppImage' \
                        'exe:Windows .exe' 'dmg:macOS .dmg'; do
              ext="${pair%%:*}"; label="${pair#*:}"
              if have ".$ext"; then echo "- $label"; else echo "- $label -- **not built for this release**"; fi
            done
            echo 'GHEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release with the installers attached
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.manifest.outputs.body }}
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.exe
            dist/**/*.dmg
          generate_release_notes: true
          fail_on_unmatched_files: false
