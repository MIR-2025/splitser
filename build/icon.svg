<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12181d"/>
      <stop offset="1" stop-color="#0b1013"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee89a"/>
      <stop offset="1" stop-color="#4ad07a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- tiling panes: one tall pane + two stacked panes -->
  <rect x="180" y="180" width="280" height="664" rx="30" fill="url(#g)"/>
  <rect x="500" y="180" width="344" height="312" rx="30" fill="url(#g)" opacity="0.92"/>
  <rect x="500" y="532" width="344" height="312" rx="30" fill="url(#g)" opacity="0.80"/>
</svg>
