<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:" />
  <title>Splitser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="setbar" id="setbar"><!-- set pills injected by renderer.js --></div>
  <div class="grid" id="grid"><!-- one .gridset per set, injected by renderer.js --></div>

  <div class="statusbar">
    <span class="hoverurl" id="hoverurl"></span>
    <div class="status-right">
      <span class="grid-picker" id="grid-picker">
        <button class="gbtn" id="grid-btn" title="Grid layout (up to 3×3)">Grid: <b id="grid-dims">1×1</b><span class="gcaret">&#9662;</span></button>
        <div class="grid-flyout" id="grid-flyout" hidden>
          <div class="gf-matrix" id="gf-matrix"></div>
          <div class="gf-label" id="gf-label">1 × 1</div>
        </div>
      </span>
      <button class="sbtn" id="btn-vault" title="Vault (passwords)">&#128273;</button>
      <button class="sbtn" id="btn-bookmarks" title="Bookmarks">&#9733;</button>
      <button class="sbtn" id="btn-downloads" title="Downloads" hidden>&#8595;<span class="dl-badge" id="dl-badge"></span></button>
      <button class="sbtn" id="btn-theme" title="Theme &amp; backdrop">&#127912;</button>
      <button class="sbtn" id="btn-settings" title="Settings">&#9881;</button>
      <span class="brand" id="paneinfo">Splitser</span>
    </div>
  </div>

  <div class="panel" id="panel-bookmarks" hidden>
    <div class="panel-h">Bookmarks</div>
    <div class="panel-body" id="bm-list"></div>
  </div>

  <div class="panel" id="panel-downloads" hidden>
    <div class="panel-h">Downloads <button class="panel-link" id="open-dl-folder">Open folder</button></div>
    <div class="panel-body" id="dl-list"></div>
  </div>

  <div class="panel" id="panel-settings" hidden>
    <div class="panel-h">Settings</div>
    <div class="panel-body settings">
      <label>Home page<input id="set-home" type="text" spellcheck="false" /></label>
      <label>Search URL <span class="hint">%s = your query</span><input id="set-search" type="text" spellcheck="false" /></label>
      <div class="set-row">
        <button class="danger" data-clear="history">Clear history</button>
        <button class="danger" data-clear="bookmarks">Clear bookmarks</button>
        <button class="danger" data-clear="session">Reset session</button>
      </div>
    </div>
  </div>

  <div class="panel panel-vault" id="panel-vault" hidden>
    <div class="panel-h">Vault <span class="panel-sub">local · encrypted</span></div>
    <div class="panel-body" id="vault-body"></div>
  </div>

  <div class="panel panel-theme" id="panel-theme" hidden>
    <div class="panel-h">Theme <span class="panel-sub">colors &amp; backdrop</span></div>
    <div class="panel-body" id="theme-body"></div>
  </div>

  <script type="module" src="renderer.js"></script>
</body>
</html>
